[build]
  command = "(which bun > /dev/null 2>&1 || npm install -g bun) && bun run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
